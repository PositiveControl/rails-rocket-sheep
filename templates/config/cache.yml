# Solid Cache configuration
# https://github.com/rails/solid_cache

default: &default
  store_options:
    max_age: 1.week.to_i
    max_size: 256.megabytes

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  store_options:
    max_age: 1.month.to_i
    max_size: 1.gigabyte
