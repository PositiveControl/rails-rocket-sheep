# Solid Cable configuration for Action Cable
# https://github.com/rails/solid_cable
#
# Development uses solid_cable rather than :async so that behaviour matches
# production. The `cable` database is defined in config/database.yml.

development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
