# Solid Queue configuration
# https://github.com/rails/solid_queue
#
# Solid Queue connects to the `queue` database via
# `config.solid_queue.connects_to` in config/environments/production.rb.

default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance_interval: 30
  workers:
    - queues: "*"
      threads: 5
      # Scale worker processes per host without a redeploy
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
